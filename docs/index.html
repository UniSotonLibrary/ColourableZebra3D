<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Texture Viewer</title>
    <script src="./assets/vendor/babylon.js"></script>
    <script src="./assets/vendor/babylonjs.loaders.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        #sidebar {
            width: 480px;
            flex: 0 0 480px;
            padding: 20px;
            background: #252525;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        #renderCanvas {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: #007acc;
            border: none;
        }
        button:hover { background: #005999; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        .anim-group { display: flex; gap: 10px; }
        #textureViewer {
            flex: 1 1 0;
            min-height: 120px;
            background: #000;
            border: 1px solid #444;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #textureViewer img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        @media (max-width: 700px), (max-width: 1000px) and (max-height: 500px) {
            html, body {
                height: 100vh;
                height: 100dvh;
            }
            body {
                flex-direction: column;
            }
            #sidebar {
                width: 100%;
                flex: 0 0 auto;
                height: auto;
                padding: 12px;
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-areas:
                    "title title"
                    "search select"
                    "mode refresh"
                    "animation texture";
                gap: 8px;
            }
            #sidebar h2 {
                grid-area: title;
                margin: 0;
                font-size: 1.2rem;
            }
            #searchGroup { grid-area: search; }
            #selectGroup { grid-area: select; }
            #toggleModelBtn { grid-area: mode; }
            #refreshBtn { grid-area: refresh; }
            #animControls { grid-area: animation; }
            #sidebar input, #sidebar select {
                font-size: 16px;
            }
            #sidebar button {
                padding: 8px;
            }
            #textureViewer {
                grid-area: texture;
                min-height: 0;
                height: 64px;
            }
            #renderCanvas {
                width: 100%;
                height: 0;
                min-height: 0;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Zebra Texture Viewer</h2>
        
        <div id="searchGroup">
            <label for="searchInput">Search Zebra:</label>
            <input type="text" id="searchInput" placeholder="Type Zebra name...">
        </div>

        <div id="selectGroup">
            <label for="textureSelect">Select your Zebra:</label>
            <select id="textureSelect"></select>
        </div>

        <button id="toggleModelBtn" style="background: #28a745;">Mode: High-Poly (Animated)</button>
        <button id="refreshBtn" class="secondary">Refresh Zebra List</button>

        <div id="animControls" style="display: none;">
            <label>Animation Controls:</label>
            <div class="anim-group">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
            </div>
        </div>

        <div id="textureViewer"><img id="textureImg" alt="Zebra texture"></div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        window.TEXTURES_API_URL = "https://api.github.com/repos/UniSotonLibrary/ColourableZebra3D/contents/docs/assets/textures";
    </script>
    <script src="./assets/viewer.js"></script>
</body>
</html>
