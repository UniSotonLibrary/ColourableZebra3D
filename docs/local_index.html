<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Texture Viewer</title>
    <script src="./assets/vendor/babylon.js"></script>
    <script src="./assets/vendor/babylonjs.loaders.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            font-family: sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        #sidebar {
            width: 320px;
            flex: 0 0 320px;
            padding: 20px;
            background: #252525;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        #renderCanvas {
            flex: 1 1 0;
            min-width: 0;
            height: 100%;
            display: block;
            touch-action: none;
            outline: none;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            cursor: pointer;
            font-weight: bold;
            background: #007acc;
            border: none;
        }
        button:hover { background: #005999; }
        button.secondary { background: #444; }
        button.secondary:hover { background: #555; }
        .anim-group { display: flex; gap: 10px; }
        #log {
            background: #000;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            color: #00ff00;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Zebra Texture Viewer</h2>
        
        <div>
            <label>Search Zebra:</label>
            <input type="text" id="searchInput" placeholder="Type Zebra name...">
        </div>

        <div>
            <label>Select your Zebra:</label>
            <select id="textureSelect" size="5"></select>
        </div>

        <button id="toggleModelBtn" style="background: #28a745;">Mode: High-Poly (Animated)</button>
        <button id="refreshBtn" class="secondary">Refresh Zebra List</button>

        <div id="animControls" style="display: none;">
            <label>Animation Controls:</label>
            <div class="anim-group">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
            </div>
        </div>

        <div id="log">Initializing...</div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        // Served locally by scanner_app/local_server.py, which also exposes
        // /api/textures returning the same JSON shape as GitHub's contents API.
        window.TEXTURES_API_URL = "/api/textures";
    </script>
    <script src="./assets/viewer.js"></script>
</body>
</html>
